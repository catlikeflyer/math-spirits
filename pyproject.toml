[project]
name = "math-spirits"
version = "1.0.0"
description = "High-precision mathematical reasoning models optimized for Apple Silicon (MLX) and WebGPU."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sse-starlette>=2.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "datasets>=2.14.0",
    "pyyaml>=6.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "web/dist",
    "web/node_modules",
    "scratch",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
