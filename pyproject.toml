[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "web/dist",
    "web/node_modules",
    "scratch",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
